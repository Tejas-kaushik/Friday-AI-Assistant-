[project]
name = "friday"
version = "0.1.0"
description = "FRIDAY - low-latency voice assistant. MCP tool server + LiveKit voice agent."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "anthropic>=0.40",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "livekit-agents[silero,turn-detector]>=1.0",
    "livekit-plugins-deepgram>=1.0",
    "livekit-plugins-cartesia>=1.0",
    "livekit-plugins-anthropic>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
friday = "server:main"
friday_voice = "agent_friday:dev"
friday_eval = "evals.run_evals:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["friday"]
only-include = ["friday", "server.py", "agent_friday.py", "evals"]